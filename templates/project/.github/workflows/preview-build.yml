# Builds the static app of a PR marked ready, with no secret, and uploads it.
# Drafts are skipped (a PR opened ready gets one at once): the agents do not need
# the preview, only the owner does.
# Not a required check (a skipped job would report success anyway).
name: preview-build
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
permissions:
  contents: read
jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx --no-install vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
