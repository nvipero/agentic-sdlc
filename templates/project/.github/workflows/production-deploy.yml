# Deploys main to the project's production address after tests passed on main's
# own commit. workflow_run runs main's definition; the branch filter and the job
# conditions keep PR test runs out, because environment "production" (deployment
# branch: main only) cannot tell them apart: its ref is always main. As in
# preview-deploy, the artifact is data, and the target script (deploy.target in
# main's .factory/config.yaml) deploys only its regular files as a static site.
# Only main's newest commit is deployed, and deploys queue instead of replacing
# each other, so a quick series of merges ends on the last one. After the
# deploy, the production address must serve it.
name: production-deploy
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  check:
    # No environment here: a run that does not deploy never loads the token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.newest.outputs.go }}
    steps:
      - name: main's build exists, and its commit is still main's head
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$ATTEMPT" =~ ^[0-9]+$ ]] || { echo "::error::no run attempt in the event"; exit 1; }
          # Unlike a draft PR, a push always uploads: a missing build is an error
          # (re-running only failed jobs can drop it; re-run all jobs instead).
          n="$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq "[.artifacts[] | select(.name == \"main-dist-$ATTEMPT\" and (.expired | not))] | length")"
          [ "$n" = 1 ] || { echo "::error::$n main-dist-$ATTEMPT builds in tests run $RUN, expected 1: re-run all its jobs"; exit 1; }
          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$head" != "$SHA" ]; then
            echo "::notice::${SHA:0:7} is not main's head (${head:0:7}): the newest commit deploys if its tests pass"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: check
    if: >-
      needs.check.outputs.go == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      queue: max
    environment:
      name: production
      url: ${{ steps.live.outputs.url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-dist-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .factory
          path: main
      - name: Deployment target
        id: target
        run: |
          set -euo pipefail
          [ -f main/.factory/config.yaml ] || { echo "::error::no .factory/config.yaml on main"; exit 1; }
          target="$(ruby -ryaml -e 'c = YAML.load_file(ARGV[0]); d = c.is_a?(Hash) ? c["deploy"] : nil; puts(d.is_a?(Hash) ? d["target"].to_s : "")' main/.factory/config.yaml)"
          [ -n "$target" ] || { echo "::error::deploy.target missing in .factory/config.yaml"; exit 1; }
          [[ "$target" =~ ^[a-z0-9-]+$ && -f "main/.github/scripts/deploy/$target.sh" ]] || { echo "::error::no deploy script for target '$target'"; exit 1; }
          echo "script=main/.github/scripts/deploy/$target.sh" >> "$GITHUB_OUTPUT"
      - name: Check the build, assemble the output
        env:
          SCRIPT: ${{ steps.target.outputs.script }}
          ART: ${{ runner.temp }}/artifact
          OUT: ${{ runner.temp }}/deploy
        run: |
          set -euo pipefail
          if [ -n "$(find "$ART" ! -type f ! -type d -print -quit)" ]; then
            echo "::error::the artifact has links or special files"; exit 1
          fi
          size_kb="$(du -sk "$ART" | cut -f1)"
          [ "$size_kb" -le 51200 ] || { echo "::error::the artifact is ${size_kb} KB (limit 50 MB)"; exit 1; }
          [ -f "$ART/index.html" ] || { echo "::error::the artifact has no index.html"; exit 1; }
          bash "$SCRIPT" assemble "$ART" "$OUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Target tools
        env:
          SCRIPT: ${{ steps.target.outputs.script }}
        run: bash "$SCRIPT" install
      - name: Still main's head
        # Queued deploys may start out of order. Fails rather than passes, so the
        # production environment never records a deploy that did not happen.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          [ "$head" = "$SHA" ] || { echo "::error::${SHA:0:7} superseded by ${head:0:7}: the newest commit deploys if its tests pass"; exit 1; }
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRIPT: ${{ steps.target.outputs.script }}
          OUT: ${{ runner.temp }}/deploy
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          url="$(bash "$SCRIPT" production "$OUT" "$SHA")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: The production address serves it
        id: live
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRIPT: ${{ steps.target.outputs.script }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          address="$(bash "$SCRIPT" live "$URL")"
          echo "url=$address" >> "$GITHUB_OUTPUT"
