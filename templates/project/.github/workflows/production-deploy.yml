# Deploys main to the project's production address (<repo>.vercel.app: the
# Vercel project is named after the repository) after tests passed on main's own
# commit. workflow_run runs main's definition; the branch filter and the job
# conditions keep PR test runs out, because environment "production" (deployment
# branch: main only) cannot tell them apart: its ref is always main. As in
# preview-deploy, the artifact is data: only its regular files are copied into a
# static-only Build Output. Only main's newest commit is deployed, and deploys
# queue instead of replacing each other, so a quick series of merges ends on the
# last one. After the deploy, the production address must serve it (a rollback
# in the Vercel dashboard stops that until undone).
name: production-deploy
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  check:
    # No environment here: a run that does not deploy never loads the token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.newest.outputs.go }}
    steps:
      - name: main's build exists, and its commit is still main's head
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$ATTEMPT" =~ ^[0-9]+$ ]] || { echo "::error::no run attempt in the event"; exit 1; }
          # Unlike a draft PR, a push always uploads: a missing build is an error
          # (re-running only failed jobs can drop it; re-run all jobs instead).
          n="$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq "[.artifacts[] | select(.name == \"main-dist-$ATTEMPT\" and (.expired | not))] | length")"
          [ "$n" = 1 ] || { echo "::error::$n main-dist-$ATTEMPT builds in tests run $RUN, expected 1: re-run all its jobs"; exit 1; }
          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$head" != "$SHA" ]; then
            echo "::notice::${SHA:0:7} is not main's head (${head:0:7}): the newest commit deploys if its tests pass"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: check
    if: >-
      needs.check.outputs.go == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      queue: max
    environment:
      name: production
      url: ${{ format('https://{0}.vercel.app', github.event.repository.name) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: main-dist-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact
      - name: Assemble a static-only output
        env:
          ART: ${{ runner.temp }}/artifact
          OUT: ${{ runner.temp }}/deploy/.vercel/output
        run: |
          set -euo pipefail
          if [ -n "$(find "$ART" ! -type f ! -type d -print -quit)" ]; then
            echo "::error::the artifact has links or special files"; exit 1
          fi
          size_kb="$(du -sk "$ART" | cut -f1)"
          [ "$size_kb" -le 51200 ] || { echo "::error::the artifact is ${size_kb} KB (limit 50 MB)"; exit 1; }
          [ -f "$ART/index.html" ] || { echo "::error::the artifact has no index.html"; exit 1; }
          mkdir -p "$OUT/static"
          printf '{"version":3}\n' > "$OUT/config.json"
          cp -R "$ART"/. "$OUT/static/"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vercel CLI
        run: npm install --global --ignore-scripts vercel@64.3.1
      - name: Still main's head
        # Queued deploys may start out of order. Fails rather than passes, so the
        # production environment never records a deploy that did not happen.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          [ "$head" = "$SHA" ] || { echo "::error::${SHA:0:7} superseded by ${head:0:7}: the newest commit deploys if its tests pass"; exit 1; }
      - name: Deploy
        id: deploy
        working-directory: ${{ runner.temp }}/deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          vercel deploy --prebuilt --prod --meta "sha=$SHA" --non-interactive --no-color > "$RUNNER_TEMP/deploy.out"
          # stdout carries the deployment URL; take the first one.
          url="$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' "$RUNNER_TEMP/deploy.out" | head -1 || true)"
          [ -n "$url" ] || { echo "::error::no deployment URL in the output"; cat "$RUNNER_TEMP/deploy.out"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          path: main-scripts
      - name: The production address serves it
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          URL: ${{ steps.deploy.outputs.url }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          host="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9-').vercel.app"
          bash main-scripts/.github/scripts/vercel-preview.sh live "$URL" "$host"
