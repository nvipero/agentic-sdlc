# Removes every preview of a closed or merged PR. workflow_run runs main's
# definition in environment "preview" (scripts from main). The PR number from the artifact is
# checked to be a number; nothing else from it is used.
name: preview-cleanup
on:
  workflow_run:
    workflows: [preview-closed]
    types: [completed]
permissions:
  actions: read
  contents: read
  deployments: write
jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: closed-pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Remove the PR's previews
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          FILE: ${{ runner.temp }}/pr/number
        run: |
          set -euo pipefail
          PR="$(head -c 12 "$FILE" | tr -d '\n')"
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::not a PR number"; exit 1; }
          bash .github/scripts/vercel-preview.sh prune "$PR"
      - name: Mark the PR's deployments inactive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FILE: ${{ runner.temp }}/pr/number
        run: |
          set -euo pipefail
          PR="$(head -c 12 "$FILE" | tr -d '\n')"
          [[ "$PR" =~ ^[0-9]+$ ]] || exit 1
          for id in $(gh api --paginate "repos/$REPO/deployments?environment=pr-preview" \
              --jq ".[] | select(.payload.pr == $PR) | .id"); do
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive --silent
            echo "deployment $id inactive"
          done
