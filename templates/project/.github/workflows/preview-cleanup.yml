# Removes every preview of a closed or merged PR. workflow_run runs main's
# definition in environment "preview". The PR number from the artifact is
# checked to be a number; nothing else from it is used.
name: preview-cleanup
on:
  workflow_run:
    workflows: [preview-closed]
    types: [completed]
permissions:
  actions: read
jobs:
  cleanup:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: closed-pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vercel CLI
        run: npm install --global --ignore-scripts vercel@64.3.1
      - name: Remove the PR's previews
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          FILE: ${{ runner.temp }}/pr/number
        run: |
          set -euo pipefail
          PR="$(head -c 12 "$FILE" | tr -d '\n')"
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::not a PR number"; exit 1; }
          vercel list --meta "pr=$PR" --environment preview --json --non-interactive --no-color > "$RUNNER_TEMP/list.json"
          n=0
          for old in $(grep -oE '[a-z0-9-]+\.vercel\.app' "$RUNNER_TEMP/list.json" | sort -u); do
            vercel remove "$old" --safe --yes --non-interactive --no-color; n=$((n + 1))
          done
          echo "removed $n preview(s) of #$PR"
