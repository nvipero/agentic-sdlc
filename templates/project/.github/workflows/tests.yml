# Runs the PR's code, so it has a read-only token and no secrets. The commands
# are fixed here (agents cannot change workflow files), not taken from the
# project's npm scripts. For a PR that is not a draft, the build is uploaded
# for preview-deploy; for a push to main, for production-deploy. Both run only
# after this whole workflow passes.
name: tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Type check
        # Build mode follows project references: a root tsconfig.json with only
        # references checks nothing with plain --noEmit. Every tracked TypeScript
        # file under src/ and tests/unit/ must be in a checked project.
        run: |
          set -euo pipefail
          listed="$RUNNER_TEMP/tsc-files"
          if ! npx --no-install tsc -b --noEmit --listFiles > "$listed"; then
            grep -v '^/' "$listed" || true
            exit 1
          fi
          root="$(pwd -P)/"
          grep '^/' "$listed" | sed "s|^$root||" | sort -u > "$listed.checked"
          git ls-files -- 'src/*.ts' 'src/*.tsx' 'src/*.mts' 'src/*.cts' \
            'tests/unit/*.ts' 'tests/unit/*.tsx' 'tests/unit/*.mts' 'tests/unit/*.cts' | sort > "$listed.tracked"
          missing="$(comm -23 "$listed.tracked" "$listed.checked")"
          if [ -n "$missing" ]; then
            echo "not in any TypeScript project that the type check covers (add them to a tsconfig include):"
            echo "$missing"
            exit 1
          fi
          echo "type check covered $(wc -l < "$listed.tracked" | tr -d ' ') tracked file(s)"
      - name: Unit tests
        run: npx --no-install vitest run
      - name: Deno tests
        # Components tested with Deno (.github/scripts/components.sh deno), with the
        # image's Deno (DENO_VERSION in .devcontainer/Dockerfile). The paths and their
        # reader come from the checkout (Ruby on the runner); the Deno pin and flags are fixed here.
        run: |
          set -euo pipefail
          paths="$(bash .github/scripts/components.sh deno)"
          if [ -z "$paths" ] || [ -z "$(find $paths -name '*_test.ts' 2>/dev/null | head -1)" ]; then
            echo "no Deno tests"; exit 0
          fi
          npx -y deno@2.1.4 test --allow-env $paths
      - name: Build variables
        # main's build is production's, a PR's build is its preview: each gets the
        # public values of its own environment, never the other's, from repository
        # variables (vars holds no secrets). VITE_<X> is production's, STAGING_<X>
        # staging's, for Supabase's address and publishable key (empty when not set)
        # and the names in .factory/config.yaml build.variables (components.sh
        # build-variables). Written to a file that only the Build step reads; this
        # step runs only .github/ code and jq.
        env:
          VARS: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          declared="$(bash .github/scripts/components.sh build-variables)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then env=production; else env=staging; fi
          pairs="$(for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY $declared; do
            if [ "$env" = production ]; then echo "$name $name"; else echo "$name STAGING_${name#VITE_}"; fi
          done)"
          out="$RUNNER_TEMP/build-variables.json"
          jq -n --argjson vars "$VARS" --arg pairs "$pairs" '
            ($vars // {} | with_entries(.key |= ascii_upcase)) as $v
            | [$pairs | split("\n")[] | split(" ")
               | if $v[.[1]] != null then {(.[0]): $v[.[1]]}
                 elif (.[0] | IN("VITE_SUPABASE_URL", "VITE_SUPABASE_PUBLISHABLE_KEY")) then {(.[0]): ""} else empty end]
            | add // {}' > "$out"
          missing=
          while read -r name source; do
            if jq -e --arg n "$name" 'has($n) and .[$n] != ""' "$out" > /dev/null; then
              echo "$name: $env ($source)"
            else
              case "$name" in
                VITE_SUPABASE_URL|VITE_SUPABASE_PUBLISHABLE_KEY) echo "$name: empty, $source not set" ;;
                *) missing="$missing $source" ;;
              esac
            fi
          done <<< "$pairs"
          [ -n "$declared" ] || echo "no build variables declared"
          if [ -n "$missing" ]; then
            msg="repository variables not set:$missing (factory docs/setup.md, \"Build variables\")"
            if [ "$env" = production ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"
          fi
          used="$(grep -rhoE 'import\.meta\.env\.VITE_[A-Z0-9_]+' src 2> /dev/null | sed 's/^import\.meta\.env\.//' | sort -u || true)"
          for name in $used; do
            grep -qx "$name" <<< "$(cut -d' ' -f1 <<< "$pairs")" \
              || echo "::warning::$name is read in src/ but not in .factory/config.yaml build.variables, so the build leaves it empty"
          done
      - name: Build
        run: |
          set -euo pipefail
          exports="$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' "$RUNNER_TEMP/build-variables.json")"
          eval "$exports"
          npx --no-install vite build
      - if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Per attempt: a re-run must not collide with the earlier attempt's build.
          name: main-dist-${{ github.run_attempt }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: tests/acceptance
      - name: Browser
        run: npx --no-install playwright install --with-deps chromium
        working-directory: tests/acceptance
      - name: Supabase stack
        # For a project with a component on host supabase (.github/scripts/components.sh,
        # from the checkout): the local stack on the runner's Docker, from the committed
        # supabase/supabase.lock, with the image's CLI (SUPABASE_VERSION in
        # .devcontainer/Dockerfile). Its values reach the app and the tests through
        # GITHUB_ENV; they are the stack's demo values, not secrets.
        env:
          SUPABASE_EXPERIMENTAL_STACK: "1"
          SUPABASE_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          set -euo pipefail
          components="$(bash .github/scripts/components.sh list)"
          if ! awk '$3 == "supabase" { found = 1 } END { exit !found }' <<<"$components"; then
            echo "no Supabase components"; exit 0
          fi
          npm install --global supabase@3.1.0
          vars="$(bash .github/scripts/supabase-stack.sh docker)"
          echo "$vars" >> "$GITHUB_ENV"
      - name: Acceptance tests
        run: npx --no-install playwright test --reporter=line
        working-directory: tests/acceptance
  dependency-review:
    # Compares a PR with its base; a push has nothing to compare.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
