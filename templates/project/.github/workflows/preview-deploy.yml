# Deploys the build of a PR whose tests passed (the tests workflow uploads it
# for PRs that are not drafts) to Vercel, if guards passed on the same commit.
# workflow_run runs main's definition; the deploy job runs in environment
# "preview" (deployment branch: main only), the only place the Vercel token exists. Nothing from the PR is executed here: the
# artifact is untrusted data, so only its regular files are copied into a
# static-only Build Output directory this job writes itself (no functions,
# routes or project settings from the PR). The PR number and head come from
# the event, not from the artifact. One preview per PR, at a stable address
# (<owner>-<repo>-pr-<n>.vercel.app): each new deployment takes the alias, then
# the PR's older deployments are removed. The address shows in the PR's
# deployments panel: a GitHub deployment of the PR's head in environment
# "pr-preview" (holds no secrets; "preview", which holds the token, deploys from
# main only).
name: preview-deploy
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
permissions:
  contents: read
  actions: read
  deployments: write
jobs:
  check:
    # No environment here: a draft or a PR failing guards never loads the token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.ready.outputs.go }}
    steps:
      - name: A ready PR's build, and guards passed on the same commit
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Drafts get no artifact: nothing to deploy.
          n="$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq '[.artifacts[] | select(.name == "preview-dist")] | length')"
          if [ "$n" = 0 ]; then echo "draft: no preview"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          guards="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=guards" \
            --jq '[.check_runs[] | select(.app.id == 15368)] | sort_by(.completed_at) | last | .conclusion // "none"')"
          if [ "$guards" != success ]; then echo "::notice::guards is '$guards' on ${SHA:0:7}: no preview"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact
      - name: Assemble a static-only output
        env:
          ART: ${{ runner.temp }}/artifact
          OUT: ${{ runner.temp }}/deploy/.vercel/output
        run: |
          set -euo pipefail
          if [ -n "$(find "$ART" ! -type f ! -type d -print -quit)" ]; then
            echo "::error::the artifact has links or special files"; exit 1
          fi
          size_kb="$(du -sk "$ART" | cut -f1)"
          [ "$size_kb" -le 51200 ] || { echo "::error::the artifact is ${size_kb} KB (limit 50 MB)"; exit 1; }
          [ -f "$ART/index.html" ] || { echo "::error::the artifact has no index.html"; exit 1; }
          mkdir -p "$OUT/static"
          printf '{"version":3}\n' > "$OUT/config.json"
          cp -R "$ART"/. "$OUT/static/"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vercel CLI
        run: npm install --global --ignore-scripts vercel@64.3.1
      - name: Deploy
        id: deploy
        working-directory: ${{ runner.temp }}/deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::no PR number in the event"; exit 1; }
          # Always a preview: --target=preview, and the project has a placeholder production
          # deployment (Vercel makes a project's first deployment production regardless).
          vercel deploy --prebuilt --target=preview --meta "pr=$PR" --non-interactive --no-color > "$RUNNER_TEMP/deploy.out"
          # stdout carries the deployment URL; take the first one.
          url="$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' "$RUNNER_TEMP/deploy.out" | head -1 || true)"
          [ -n "$url" ] || { echo "::error::no deployment URL in the output"; cat "$RUNNER_TEMP/deploy.out"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          path: main-scripts
      - name: Stable address, older previews removed
        id: alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          URL: ${{ steps.deploy.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="$(printf '%s' "$REPO" | tr '/A-Z' '-a-z' | tr -cd 'a-z0-9-')-pr-$PR.vercel.app"
          bash main-scripts/.github/scripts/vercel-preview.sh alias "$URL" "$name"
          echo "url=https://$name" >> "$GITHUB_OUTPUT"
          bash main-scripts/.github/scripts/vercel-preview.sh prune "$PR" "$URL"
      - name: Show the preview on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.alias.outputs.url }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          id="$(jq -n --arg sha "$SHA" --argjson pr "$PR" '{ref: $sha, environment: "pr-preview",
              auto_merge: false, required_contexts: [], transient_environment: true,
              production_environment: false, payload: {pr: $pr}, description: "Vercel preview"}' \
            | gh api -X POST "repos/$REPO/deployments" --input - --jq .id)"
          gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=success \
            -f environment_url="$URL" -F auto_inactive=false --silent
          echo "deployment $id: $URL"
