# Deploys the build of a PR whose tests passed (the tests workflow uploads it
# for PRs that are not drafts) to the project's deployment target, if guards
# passed on the same commit. workflow_run runs main's definition; the deploy job
# runs in environment "preview" (deployment branch: main only), the only place
# the target's secrets exist. Nothing from the PR is executed here: the artifact
# is untrusted data, checked to hold only regular files, and the target script
# (deploy.target in main's .factory/config.yaml, .github/scripts/deploy/<target>.sh)
# deploys only those files as a static site. The PR number and head come from
# the event, not from the artifact. One preview per PR, at a stable address:
# each new deployment takes it, then the PR's older deployments are removed. The
# address shows in the PR's deployments panel: a GitHub deployment of the PR's
# head in environment "pr-preview" (holds no secrets; "preview", which holds
# them, deploys from main only).
name: preview-deploy
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
permissions:
  contents: read
  actions: read
  deployments: write
jobs:
  check:
    # No environment here: a draft or a PR failing guards never loads the token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.ready.outputs.go }}
    steps:
      - name: A ready PR's build, and guards passed on the same commit
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Drafts get no artifact: nothing to deploy.
          n="$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq '[.artifacts[] | select(.name == "preview-dist")] | length')"
          if [ "$n" = 0 ]; then echo "draft: no preview"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          guards="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=guards" \
            --jq '[.check_runs[] | select(.app.id == 15368)] | sort_by(.completed_at) | last | .conclusion // "none"')"
          if [ "$guards" != success ]; then echo "::notice::guards is '$guards' on ${SHA:0:7}: no preview"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .factory
          path: main
      - name: Deployment target
        id: target
        run: |
          set -euo pipefail
          [ -f main/.factory/config.yaml ] || { echo "::error::no .factory/config.yaml on main"; exit 1; }
          target="$(ruby -ryaml -e 'c = YAML.load_file(ARGV[0]); d = c.is_a?(Hash) ? c["deploy"] : nil; puts(d.is_a?(Hash) ? d["target"].to_s : "")' main/.factory/config.yaml)"
          [ -n "$target" ] || { echo "::error::deploy.target missing in .factory/config.yaml"; exit 1; }
          [[ "$target" =~ ^[a-z0-9-]+$ && -f "main/.github/scripts/deploy/$target.sh" ]] || { echo "::error::no deploy script for target '$target'"; exit 1; }
          echo "script=main/.github/scripts/deploy/$target.sh" >> "$GITHUB_OUTPUT"
      - name: Check the build, assemble the output
        env:
          SCRIPT: ${{ steps.target.outputs.script }}
          ART: ${{ runner.temp }}/artifact
          OUT: ${{ runner.temp }}/deploy
        run: |
          set -euo pipefail
          if [ -n "$(find "$ART" ! -type f ! -type d -print -quit)" ]; then
            echo "::error::the artifact has links or special files"; exit 1
          fi
          size_kb="$(du -sk "$ART" | cut -f1)"
          [ "$size_kb" -le 51200 ] || { echo "::error::the artifact is ${size_kb} KB (limit 50 MB)"; exit 1; }
          [ -f "$ART/index.html" ] || { echo "::error::the artifact has no index.html"; exit 1; }
          bash "$SCRIPT" assemble "$ART" "$OUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Target tools
        env:
          SCRIPT: ${{ steps.target.outputs.script }}
        run: bash "$SCRIPT" install
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SCRIPT: ${{ steps.target.outputs.script }}
          OUT: ${{ runner.temp }}/deploy
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::no PR number in the event"; exit 1; }
          url="$(bash "$SCRIPT" preview "$OUT" "$PR")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Stable address, older previews removed
        id: alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SCRIPT: ${{ steps.target.outputs.script }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          address="$(bash "$SCRIPT" address "$PR" "$URL")"
          echo "url=$address" >> "$GITHUB_OUTPUT"
          bash "$SCRIPT" prune "$PR" "$URL"
      - name: Show the preview on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.alias.outputs.url }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          id="$(jq -n --arg sha "$SHA" --argjson pr "$PR" '{ref: $sha, environment: "pr-preview",
              auto_merge: false, required_contexts: [], transient_environment: true,
              production_environment: false, payload: {pr: $pr}, description: "Preview"}' \
            | gh api -X POST "repos/$REPO/deployments" --input - --jq .id)"
          gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=success \
            -f environment_url="$URL" -F auto_inactive=false --silent
          echo "deployment $id: $URL"
