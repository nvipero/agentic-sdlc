# Deploys the build of a PR whose tests passed (the tests workflow uploads it
# for PRs that are not drafts) to the project's deployment target, if guards
# passed on the same commit. workflow_run runs main's definition; the deploy job
# runs in environment "preview" (deployment branch: main only), the only place
# the target's secrets exist. Nothing from the PR is executed here: the artifact
# is untrusted data, checked to hold only regular files, and the target script
# (the frontend component's host in main's .factory/config.yaml, .github/scripts/deploy/<host>.sh)
# deploys only those files as a static site. The PR number and head come from
# the event, not from the artifact. One preview per PR, at a stable address:
# each new deployment takes it, then the PR's older deployments are removed. The
# address shows in the PR's deployments panel: a GitHub deployment of the PR's
# head in environment "pr-preview" (holds no secrets; "preview", which holds
# them, deploys from main only). A project's Supabase components go to the shared
# staging project first (.github/scripts/supabase-deploy.sh preview): the PR's
# supabase/ is checked out apart from main's scripts, as data for the CLI.
name: preview-deploy
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
permissions:
  contents: read
  actions: read
  deployments: write
  pull-requests: read
jobs:
  check:
    # No environment here: a draft or a PR failing guards never loads the token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.ready.outputs.go }}
    steps:
      - name: A ready PR's build, and guards passed on the same commit
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Drafts get no artifact: nothing to deploy.
          n="$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq '[.artifacts[] | select(.name == "preview-dist")] | length')"
          if [ "$n" = 0 ]; then echo "draft: no preview"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          guards="$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=guards" \
            --jq '[.check_runs[] | select(.app.id == 15368)] | sort_by(.completed_at) | last | .conclusion // "none"')"
          if [ "$guards" != success ]; then echo "::notice::guards is '$guards' on ${SHA:0:7}: no preview"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One staging project: previews deploy one at a time, none dropped (every
    # project's previews queue, Supabase or not).
    concurrency:
      group: staging
      queue: max
    environment: preview
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .factory
            supabase
          path: main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The PR's supabase/ only, as data: nothing from this checkout is run.
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            supabase
          path: pr
      - name: Deployment target
        id: target
        run: |
          set -euo pipefail
          host="$(bash main/.github/scripts/components.sh frontend | cut -d" " -f1)"
          echo "script=main/.github/scripts/deploy/$host.sh" >> "$GITHUB_OUTPUT"
      - name: Check the build, assemble the output
        env:
          SCRIPT: ${{ steps.target.outputs.script }}
          ART: ${{ runner.temp }}/artifact
          OUT: ${{ runner.temp }}/deploy
        run: |
          set -euo pipefail
          if [ -n "$(find "$ART" ! -type f ! -type d -print -quit)" ]; then
            echo "::error::the artifact has links or special files"; exit 1
          fi
          size_kb="$(du -sk "$ART" | cut -f1)"
          [ "$size_kb" -le 51200 ] || { echo "::error::the artifact is ${size_kb} KB (limit 50 MB)"; exit 1; }
          [ -f "$ART/index.html" ] || { echo "::error::the artifact has no index.html"; exit 1; }
          bash "$SCRIPT" assemble "$ART" "$OUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Target tools
        env:
          SCRIPT: ${{ steps.target.outputs.script }}
        run: bash "$SCRIPT" install
      - name: Supabase CLI
        # Installed without the token. The image's version (SUPABASE_VERSION in
        # .devcontainer/Dockerfile).
        id: supabase
        working-directory: main
        run: |
          set -euo pipefail
          if bash .github/scripts/components.sh list | awk '$3 == "supabase" { found = 1 } END { exit !found }'; then
            npm install --global supabase@3.1.0
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Still the PR's open head
        # Queued runs may start out of order: a re-run, a late older run or a closed PR
        # must not take the preview or reset staging. Fails rather than passes, as
        # production's head check.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::no PR number in the event"; exit 1; }
          now="$(gh api "repos/$REPO/pulls/$PR" --jq '.state + " " + .head.sha')"
          [ "$now" = "open $SHA" ] || { echo "::error::PR #$PR is now '$now', not open at ${SHA:0:7}: its newest push deploys"; exit 1; }
      - name: Supabase token
        # A file the CLI reads, never the Supabase step's environment: the PR's
        # supabase/config.toml resolves env(VAR) from there (supabase-deploy.sh's header).
        if: steps.supabase.outputs.on == 'true'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TOKEN" ] || { echo "::error::no SUPABASE_ACCESS_TOKEN in environment preview (factory docs/setup.md)"; exit 1; }
          mkdir -p "$HOME/.supabase"
          (umask 077 && printf '%s' "$TOKEN" > "$HOME/.supabase/access-token")
      - name: Supabase staging
        # Staging reset to the PR's migrations and seed, then its functions, before the
        # frontend (the script's header). No secret in this step's env.
        if: steps.supabase.outputs.on == 'true'
        working-directory: pr
        env:
          VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          SUPABASE_NO_KEYRING: "1"
          SUPABASE_YES: "1"
          SUPABASE_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
          ART: ${{ runner.temp }}/artifact
        run: bash ../main/.github/scripts/supabase-deploy.sh preview "$ART"
      - name: Remove the Supabase token
        if: always()
        run: rm -f "$HOME/.supabase/access-token"
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRIPT: ${{ steps.target.outputs.script }}
          OUT: ${{ runner.temp }}/deploy
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::no PR number in the event"; exit 1; }
          url="$(bash "$SCRIPT" preview "$OUT" "$PR")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Stable address, older previews removed
        id: alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRIPT: ${{ steps.target.outputs.script }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          address="$(bash "$SCRIPT" address "$PR" "$URL")"
          echo "url=$address" >> "$GITHUB_OUTPUT"
          bash "$SCRIPT" prune "$PR" "$URL"
      - name: Show the preview on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.alias.outputs.url }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          id="$(jq -n --arg sha "$SHA" --argjson pr "$PR" '{ref: $sha, environment: "pr-preview",
              auto_merge: false, required_contexts: [], transient_environment: true,
              production_environment: false, payload: {pr: $pr}, description: "Preview"}' \
            | gh api -X POST "repos/$REPO/deployments" --input - --jq .id)"
          gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=success \
            -f environment_url="$URL" -F auto_inactive=false --silent
          echo "deployment $id: $URL"
