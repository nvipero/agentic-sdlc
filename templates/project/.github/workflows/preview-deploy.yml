# Deploys a preview-build artifact to Vercel. workflow_run runs main's
# definition, in environment "preview" (deployment branch: main only), the only
# place the Vercel token exists. Nothing from the PR is executed here: the
# artifact is untrusted data, so only its regular files are copied into a
# static-only Build Output directory this job writes itself (no functions,
# routes or project settings from the PR). The PR number and head come from
# the event, not from the artifact.
name: preview-deploy
on:
  workflow_run:
    workflows: [preview-build]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/artifact
      - name: Assemble a static-only output
        env:
          ART: ${{ runner.temp }}/artifact
          OUT: ${{ runner.temp }}/deploy/.vercel/output
        run: |
          set -euo pipefail
          if [ -n "$(find "$ART" ! -type f ! -type d -print -quit)" ]; then
            echo "::error::the artifact has links or special files"; exit 1
          fi
          size_kb="$(du -sk "$ART" | cut -f1)"
          [ "$size_kb" -le 51200 ] || { echo "::error::the artifact is ${size_kb} KB (limit 50 MB)"; exit 1; }
          [ -f "$ART/index.html" ] || { echo "::error::the artifact has no index.html"; exit 1; }
          mkdir -p "$OUT/static"
          printf '{"version":3}\n' > "$OUT/config.json"
          cp -R "$ART"/. "$OUT/static/"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Vercel CLI
        run: npm install --global --ignore-scripts vercel@64.3.1
      - name: Deploy
        id: deploy
        working-directory: ${{ runner.temp }}/deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Always a preview: without --target, a prebuilt deploy goes to production.
          vercel deploy --prebuilt --target=preview --non-interactive --no-color > "$RUNNER_TEMP/deploy.out"
          # stdout carries the deployment URL; take the first one.
          url="$(grep -oE 'https://[a-z0-9-]+\.vercel\.app' "$RUNNER_TEMP/deploy.out" | head -1 || true)"
          [ -n "$url" ] || { echo "::error::no deployment URL in the output"; cat "$RUNNER_TEMP/deploy.out"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::no PR number in the event"; exit 1; }
          gh pr comment "$PR" --repo "$REPO" --body "Preview of ${SHA:0:7}: $URL"
